# OPCIONAL: solo si no tienes PostgreSQL instalado en tu máquina.
# Levanta un PostgreSQL local con estas credenciales (coinciden con .env.example)
version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: biblioteca-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biblioteca_virtual
    ports:
      - "5432:5432"
    volumes:
      - biblioteca_pgdata:/var/lib/postgresql/data

volumes:
  biblioteca_pgdata:
